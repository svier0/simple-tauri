[package]
name = "simple-tauri"
version = "0.3.0"
description = "Tauri 2 desktop app helper: tray icon, multi-window, server process management, configured via compile-time JSON macros"
authors = ["心衍"]
edition = "2021"
license = "MIT"
repository = "https://github.com/svier0/simple-tauri"

[lib]
crate-type = ["rlib"]

[dependencies]
simple-tauri-macros = { version = "0.3.0", path = "macros" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-tls"] }
native-tls = "0.2"
url = "2"
zip = "2"
tokio = { version = "1", features = ["time", "sync"] }
shlex = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
