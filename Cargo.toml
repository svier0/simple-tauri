[package]
name = "simple-tauri"
version = "0.1.0"
description = "Tauri 2 desktop app helper: tray icon, multi-window, server process management, configured via compile-time JSON macros"
authors = ["心衍"]
edition = "2021"
license = "MIT"
repository = "https://github.com/svier0/simple-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "simple_tauri_lib"
crate-type = ["rlib"]

[dependencies]
simple-tauri-macros = { version = "0.1.0", path = "macros" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
