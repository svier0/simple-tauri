[package]
name = "simple-tauri-macros"
version = "0.1.0"
description = "compile-time json helpers for simple-tauri"
edition = "2021"
license = "MIT"
repository = "https://github.com/svier0/simple-tauri"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
serde_json = "1"